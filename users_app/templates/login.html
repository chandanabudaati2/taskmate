{% extends 'base.html'%}
{% load crispy_forms_tags %}

{%block title%}
    <title> Login - TaskMate</title>
{%endblock title%}

{% block content %}
    <div class="container">
        <h2>Login On TaskMate</h2>
    </br>
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        {% endif %}
        <form method="POST" class="mt-1 col-6">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary mb-5">Login</button>
        </form>
    </div>
{% endblock content %}
